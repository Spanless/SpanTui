name: CI

# Every pull request is tested here, each in its own run, and `windows` is the
# required status check; nobody waits for anyone else's run.
# - A pull request into dev runs the core tests plus the tests its changes
#   touch (dev ci --core).
# - Every other run is the full suite: the run after a merge into dev, which
#   blocks nobody, catches what the narrower pull request run missed within
#   one merge, and keeps dev's compiler cache warm for the pull requests that
#   branch from it; dev -> master normally reuses that result.
# A tree that already passed is not tested again (see the `reuse` job).
# Releases are packaged and published from the maintainer's machine
# (dev release). Policy: docs/workflow/release.md.
# Actions are pinned to commit SHAs (the tag in the trailing comment);
# Dependabot proposes updates (.github/dependabot.yml). Tool versions come
# from tools/toolchain-versions.json.
on:
  pull_request:
    branches: [master, dev]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [master, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides on a cheap Linux runner how much of the Windows job has to run.
  # skip: nothing, for a draft pull request, or when the commit under test has
  # the same tree as a commit whose push run already passed (the dev -> master
  # pull request and its merge commit both carry the tree dev was tested
  # with). Only push runs count: they run the full suite, and their head
  # commit is exactly what they tested; a pull request run tests a merge with
  # the base of that moment, and into dev only the core tests.
  # docs_only: a pull request that changes only docs/ and top-level Markdown
  # gets the static checks without a build. Push runs always build, so the run
  # after the merge stays a full safety net.
  # A failure here never skips anything.
  reuse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      skip: ${{ steps.decide.outputs.skip }}
      docs_only: ${{ steps.decide.outputs.docs_only }}
    steps:
      - name: Look for a draft, an already tested tree or a docs-only change
        id: decide
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          repo="repos/$GITHUB_REPOSITORY"
          skip=false
          docs_only=false
          if [ "$EVENT" = pull_request ] && [ "$DRAFT" = true ]; then
            echo "Draft pull request; the build runs once it is ready for review."
            skip=true
          else
            case "$EVENT" in
              pull_request) candidate="$PR_HEAD" ;;
              push) candidate=$(gh api "$repo/commits/$GITHUB_SHA" --jq '.parents[1].sha // empty') ;;
              *) candidate= ;;
            esac
            if [ -n "$candidate" ]; then
              tree=$(gh api "$repo/git/commits/$GITHUB_SHA" --jq .tree.sha)
              candidate_tree=$(gh api "$repo/git/commits/$candidate" --jq .tree.sha)
              if [ "$tree" = "$candidate_tree" ] &&
                [ "$(gh api "$repo/actions/workflows/ci.yml/runs?head_sha=$candidate&event=push&status=success" --jq .total_count)" -gt 0 ]; then
                echo "Tree $tree already passed on $candidate; the build is skipped."
                skip=true
              fi
            fi
            if [ "$skip" = false ] && [ "$EVENT" = pull_request ]; then
              files=$(gh api --paginate "$repo/pulls/$PR_NUMBER/files" --jq '.[].filename')
              if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qvE '^docs/|^[^/]+\.md$'; then
                echo "Only documentation changed; the static checks run without a build."
                docs_only=true
              fi
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  # The dev -> master pull request is a release: its version has to pass the
  # release gate (tools/check-version.ps1) before the merge, not only when
  # dev release runs after it. The checkout keeps the token, so the script
  # can list origin's tags.
  version:
    if: github.event_name == 'pull_request' && github.base_ref == 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Release version gate
        shell: pwsh
        run: ./tools/check-version.ps1

  windows:
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.skip != 'true' }}
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      BUILD: ${{ needs.reuse.outputs.docs_only != 'true' }}
      # Core tests plus the affected ones for a pull request into dev; the
      # full suite for every other run.
      CORE: ${{ github.event_name == 'pull_request' && github.base_ref == 'dev' }}
      # sccache keeps compiled objects in a local directory that travels
      # between runs as one actions/cache archive (see the restore and save
      # steps). The idle timeout is off so the server started below, which
      # owns SCCACHE_DIR, serves the whole build.
      SCCACHE_CACHE_SIZE: 2G
      SCCACHE_IDLE_TIMEOUT: '0'
      # CI never needs debug info; without it objects, the cache archive and
      # links are much smaller (docs/workflow/build.md).
      SPANTUI_DEBUG_INFO: 'OFF'
      # sccache caches compiles, not links: with GNU ld, linking the test
      # executables against the static project libraries took more than half
      # of the run. The build scripts find ld.lld in the LLVM the runner image
      # preinstalls (configure prints "Linker: lld").
      SPANTUI_LINKER: lld
      # Part of the Qt cache key: a different module set is a different kit.
      QT_MODULES: qtshadertools qtimageformats qttasktree
    steps:
      # Two commits deep: a core run diffs the tested merge against its first
      # parent.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      # The one place the Qt, MinGW and clang-format versions are written;
      # dev release refuses to package with a different Qt or MinGW.
      - name: Read the pinned tool versions
        id: versions
        shell: pwsh
        run: |
          $v = Get-Content tools/toolchain-versions.json -Raw | ConvertFrom-Json
          "qt=$($v.qt)" >> $env:GITHUB_OUTPUT
          "mingw=$($v.mingwTool)" >> $env:GITHUB_OUTPUT
          "clang_format=$($v.clangFormat)" >> $env:GITHUB_OUTPUT
          "qt_dir=$env:RUNNER_WORKSPACE\Qt" >> $env:GITHUB_OUTPUT
          "qt_key=qt-windows-$($v.qt)-$($v.mingwTool)-$($env:QT_MODULES -replace ' ', '+')" >> $env:GITHUB_OUTPUT

      # Pull requests into dev: the lines they add or change must match
      # .clang-format (tools/check-format.ps1). The runner's own LLVM has
      # another version, so the pinned one comes from PyPI. It runs before
      # the long build so a formatting miss fails within a minute.
      - name: C++ format of the changed lines
        if: env.CORE == 'true'
        shell: pwsh
        env:
          CLANG_FORMAT_VERSION: ${{ steps.versions.outputs.clang_format }}
        run: |
          python -m pip install --disable-pip-version-check --quiet "clang-format==$env:CLANG_FORMAT_VERSION"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PATH = (python -c "import sysconfig; print(sysconfig.get_path('scripts'))") + ';' + $env:PATH
          $base = git rev-parse --verify --quiet 'HEAD^1^{commit}'
          if ($LASTEXITCODE -ne 0 -or -not $base) { Write-Host 'No base commit; nothing to compare.'; exit 0 }
          ./tools/check-format.ps1 -Base $base -Require
          exit $LASTEXITCODE

      # Qt and MinGW travel as one actions/cache archive (about 420 MB) keyed
      # on the pinned versions and modules; on a hit nothing else runs. The
      # install action's own cache still cost a minute per run: it set up a
      # fresh Python and built aqtinstall's dependencies from source before
      # looking at its cache. The action sets no environment or PATH either
      # way — the build scripts find the kit through SPANTUI_QT_SDK_ROOT — so
      # a hit builds exactly like the miss that filled the cache.
      - name: Restore Qt and MinGW
        id: qt-cache
        if: env.BUILD == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.versions.outputs.qt_dir }}
          key: ${{ steps.versions.outputs.qt_key }}

      # aqtinstall 3.3.0 (the newest on PyPI) cannot read the per-arch
      # repository layout Qt 6.11+ is published in, so it comes from a pinned
      # upstream commit until a release supports it. qttasktree is optional for
      # the build, but without it Qt's own QML asset downloader package fails
      # to load and CMake warns on every configure.
      - name: Install Qt and MinGW
        if: env.BUILD == 'true' && steps.qt-cache.outputs.cache-hit != 'true'
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7'
          version: ${{ steps.versions.outputs.qt }}
          host: windows
          target: desktop
          arch: win64_mingw
          modules: ${{ env.QT_MODULES }}
          tools: ${{ steps.versions.outputs.mingw }}
          cache: false
          set-env: false
          add-tools-to-path: false

      - name: Save Qt and MinGW
        if: env.BUILD == 'true' && steps.qt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.versions.outputs.qt_dir }}
          key: ${{ steps.versions.outputs.qt_key }}

      # One archive instead of one cache request per object: with sccache's
      # GitHub Actions backend a fully cached build still spent minutes
      # fetching ~450 objects one by one. Every run restores the newest
      # archive it can see: a pull request its own from an earlier push, else
      # its base branch's.
      - name: Restore the compiler cache
        if: env.BUILD == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}\sccache
          key: sccache-windows-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: sccache-windows-

      # CMakeLists.txt picks sccache up from PATH as the compiler launcher
      # (configure prints "Compiler cache: ..."). The server is started here
      # so a cache failure shows in this step instead of silently falling back
      # to uncached compiles.
      - name: Set up sccache
        if: env.BUILD == 'true'
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Start sccache
        if: env.BUILD == 'true'
        shell: pwsh
        run: |
          $env:SCCACHE_DIR = Join-Path $env:RUNNER_TEMP 'sccache'
          "SCCACHE_DIR=$env:SCCACHE_DIR" >> $env:GITHUB_ENV
          Split-Path -Parent $env:SCCACHE_PATH >> $env:GITHUB_PATH
          & $env:SCCACHE_PATH --start-server
          & $env:SCCACHE_PATH --show-stats

      # tools/toolchain.ps1 discovers <root>\<qt>\mingw_64 and
      # <root>\Tools\mingw*_64; CMake and Ninja come from the runner PATH.
      # The Qt install leaves aqtinstall.log in the checkout, which the layout
      # check would report.
      - name: Point the build scripts at Qt
        if: env.BUILD == 'true'
        shell: pwsh
        run: |
          "SPANTUI_QT_SDK_ROOT=$env:RUNNER_WORKSPACE\Qt" >> $env:GITHUB_ENV
          Remove-Item -LiteralPath aqtinstall.log -ErrorAction SilentlyContinue

      # A core run measures the changes from the base the pull request merges
      # into: the first parent of the tested merge. The base goes in as a hash:
      # cmd would eat the ^ of HEAD^1.
      - name: Checks, build and tests
        if: env.BUILD == 'true'
        shell: pwsh
        run: |
          $ciArgs = @('ci')
          if ($env:CORE -eq 'true') {
            $base = git rev-parse --verify --quiet 'HEAD^1^{commit}'
            if ($LASTEXITCODE -eq 0 -and $base) { $ciArgs += @('--core', '--base', $base) }
            else { Write-Host 'No base commit; running the full suite.' }
          }
          & .\dev.bat @ciArgs
          exit $LASTEXITCODE

      # Where the build time went, read from Ninja's log: busy time per kind
      # of step (summed over parallel jobs) and the slowest steps. Tuning
      # reads this from runs that happen anyway instead of extra runs.
      - name: Build profile
        if: ${{ always() && env.BUILD == 'true' }}
        continue-on-error: true
        shell: pwsh
        run: |
          $log = 'target\build\.ninja_log'
          if (-not (Test-Path -LiteralPath $log)) { Write-Host 'No Ninja log.'; exit 0 }
          $steps = Get-Content -LiteralPath $log | Where-Object { $_ -notmatch '^#' } | ForEach-Object {
            $f = $_ -split "`t"
            $out = $f[3]
            $kind = switch -Regex ($out) {
              'qmlcache/.*\.obj$' { 'compile (QML)'; break }
              '\.obj$' { 'compile (C++)'; break }
              'qmlcache/.*\.cpp$' { 'qmlcachegen'; break }
              '_autogen/|mocs_compilation|moc_' { 'moc'; break }
              'qrc_|\.rcc/' { 'rcc'; break }
              '\.(exe|dll)$' { 'link'; break }
              '\.a$' { 'archive'; break }
              default { 'other' }
            }
            [pscustomobject]@{ Seconds = ([int64]$f[1] - [int64]$f[0]) / 1000; Kind = $kind; Output = $out }
          }
          $steps | Group-Object Kind | ForEach-Object {
            [pscustomobject]@{ Kind = $_.Name; Steps = $_.Count; Seconds = [math]::Round(($_.Group | Measure-Object Seconds -Sum).Sum) }
          } | Sort-Object Seconds -Descending | Format-Table -AutoSize | Out-String -Width 200 | Write-Host
          $steps | Sort-Object Seconds -Descending | Select-Object -First 20 |
            Format-Table @{ n = 'Seconds'; e = { '{0:N1}' -f $_.Seconds } }, Kind, Output -AutoSize | Out-String -Width 250 | Write-Host

      - name: Checks only (documentation change)
        if: env.BUILD != 'true'
        shell: cmd
        run: dev.bat check

      # Stopping the server prints the statistics and flushes the directory
      # before it is archived.
      - name: Compiler cache statistics
        if: ${{ always() && env.BUILD == 'true' }}
        shell: pwsh
        run: sccache --stop-server

      # dev's push runs save for the pull requests that branch from it; a
      # pull request saves for its own next push, so a fix-up rebuilds only
      # what it changed. An archive is about 200 MB without debug info, far
      # inside the repository's 10 GB quota; GitHub evicts the least recently
      # used first, and dev's newest is restored by every new pull request.
      # A failed build or test run still saves what it compiled.
      - name: Save the compiler cache
        if: ${{ !cancelled() && env.BUILD == 'true' && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/dev')) }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}\sccache
          key: sccache-windows-${{ github.run_id }}-${{ github.run_attempt }}
