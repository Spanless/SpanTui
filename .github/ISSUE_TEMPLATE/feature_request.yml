name: Feature request / 功能建议
description: Suggest an idea or an improvement. / 提出新功能或改进建议。
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / 要解决的问题
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal / 建议的方案
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives / 其他方案
