# Update proposals for the SHA-pinned GitHub Actions in .github/workflows/
# and the local composite actions in .github/actions/.
# Qt, MinGW, clang-format and sccache are pinned in
# tools/toolchain-versions.json and updated by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directories: ['/', '/.github/actions/*']
    target-branch: dev
    schedule:
      interval: monthly
    commit-message:
      prefix: chore(ci)
    groups:
      actions:
        patterns: ['*']
